[package]
edition = "2024"
rust-version = "1.95"
name = "wgpu-external-frame"
version = "0.4.0"
authors = ["Lexo Liu <me@lexo.cool>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Zero-copy import of externally produced GPU frames into wgpu textures: Linux DMA-BUF, Android AHardwareBuffer, macOS and iOS IOSurface, and Windows shared handles"
documentation = "https://docs.rs/wgpu-external-frame"
readme = "README.md"
keywords = [
    "wgpu",
    "dmabuf",
    "iosurface",
    "zero-copy",
    "interop",
]
categories = [
    "graphics",
    "rendering::graphics-api",
    "external-ffi-bindings",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/water-rs/wgpu-external-frame"

[lib]
name = "wgpu_external_frame"
path = "src/lib.rs"

[[test]]
name = "ahardware_buffer"
path = "tests/ahardware_buffer.rs"

[[test]]
name = "dma_buf"
path = "tests/dma_buf.rs"

[[test]]
name = "io_surface"
